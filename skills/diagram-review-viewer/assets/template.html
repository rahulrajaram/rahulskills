<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{VIEWER_TITLE}}</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #0f172a;
      --muted: #526075;
      --line: #111827;
      --soft-line: #cbd5e1;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: transparent; color: var(--ink); }
    body { min-height: 100vh; }
    header {
      display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
      padding: 1rem 1.4rem; background: #0f172a; color: #ffffff;
      border-bottom: 3px solid #020617;
    }
    header h1 { margin: 0; font-size: 1.08rem; letter-spacing: .015em; }
    header p { margin: .22rem 0 0; color: #cbd5e1; font-size: .82rem; }
    .badge {
      border: 1px solid #e2e8f0; border-radius: 999px; padding: .35rem .7rem;
      color: #ffffff; font-size: .72rem; white-space: nowrap;
    }
    main {
      display: grid; grid-template-columns: minmax(0, 1fr) 8px var(--rail-width, 410px);
      height: calc(100vh - 72px); min-height: 0; overflow: hidden; background: transparent;
    }
    .viewer {
      min-width: 0; min-height: 0; display: flex; flex-direction: column;
      background: transparent;
    }
    .toolbar {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      padding: .72rem 1rem; border-bottom: 2px solid var(--line); background: #ffffff;
      position: sticky; top: 0; z-index: 5;
    }
    .toolbar strong { font-size: .8rem; letter-spacing: .035em; text-transform: uppercase; }
    .controls { display: flex; gap: .38rem; }
    button {
      border: 2px solid #111827; background: #ffffff; color: #111827; border-radius: 7px;
      padding: .34rem .58rem; font-weight: 750; cursor: pointer;
    }
    button:hover { background: #f8fafc; }
    #viewport {
      position: relative; flex: 1; min-height: 0; overflow: auto; padding: 2rem;
      background: transparent; cursor: grab; touch-action: none; user-select: none;
    }
    #viewport.dragging { cursor: grabbing; }
    #diagram { width: max-content; min-width: 100%; }
    #diagram svg {
      display: block; max-width: none !important; height: auto !important;
      margin: 0 auto; background: transparent !important;
    }
    .error {
      width: auto !important; margin: 1rem; padding: 1rem; border: 3px solid #991b1b;
      color: #7f1d1d; background: #ffffff; white-space: pre-wrap;
    }
    .rail-resizer {
      position: relative; z-index: 10; width: 8px; min-height: 0;
      cursor: col-resize; background: #e2e8f0; touch-action: none;
      border: 0; border-left: 1px solid #94a3b8; border-right: 1px solid #94a3b8;
    }
    .rail-resizer::after {
      content: ''; position: absolute; top: 50%; left: 2px; width: 2px; height: 46px;
      transform: translateY(-50%); border-left: 1px solid #64748b; border-right: 1px solid #64748b;
    }
    .rail-resizer:hover, .rail-resizer:focus-visible, .rail-resizer.dragging {
      background: #cbd5e1; outline: none;
    }
    body.resizing-rail, body.resizing-rail * { cursor: col-resize !important; user-select: none !important; }
    aside { min-height: 0; padding: 1.1rem 1.15rem 2rem; overflow: auto; background: #f5f5f5; }
    aside h2 { margin: 0 0 .3rem; font-size: 1.02rem; }
    .where-we-are { margin: .7rem 0 1rem; padding-bottom: .3rem; }
    .where-we-are p { margin: 0 0 .72rem; color: #334155; font-size: .82rem; line-height: 1.55; }
    .where-we-are p:last-child { margin-bottom: 0; }
    .where-we-are strong { color: #0f172a; }
    .rail-section { border-top: 1px solid var(--soft-line); }
    .rail-section summary {
      display: flex; align-items: center; gap: .55rem; padding: .85rem 0;
      cursor: pointer; color: #334155; font-size: .7rem; font-weight: 800;
      text-transform: uppercase; letter-spacing: .11em; list-style: none;
    }
    .rail-section summary::-webkit-details-marker { display: none; }
    .rail-section summary::before {
      content: '▸'; width: 1rem; color: #0f172a; font-size: .9rem;
      transform-origin: center; transition: transform 120ms ease;
    }
    .rail-section[open] summary::before { transform: rotate(90deg); }
    .rail-section summary:focus-visible { outline: 2px solid #111827; outline-offset: 4px; }
    .rail-content { padding: 0 0 .9rem 1.55rem; }
    .rail-content p, .rail-content li { margin-top: .32rem; font-size: .82rem; line-height: 1.48; }
    ul, ol { margin: .35rem 0 0; padding-left: 1.15rem; }
    pre {
      overflow: auto; margin: .5rem 0 0; padding: .7rem; border: 1px solid #94a3b8;
      background: #ffffff; color: #111827; font: .72rem/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .boundary { border: 2px dashed #111827; padding: .7rem; background: #ffffff; }
    .digest { overflow-wrap: anywhere; color: var(--muted); font-size: .7rem; }
    .legend { display: grid; grid-template-columns: 34px 1fr; gap: .5rem .65rem; align-items: center; }
    .shape { height: 24px; border: 2px solid #111827; background: #ffffff; }
    .shape.actor { border-radius: 999px; }
    .shape.state { width: 24px; border-radius: 50%; justify-self: center; }
    .shape.decision { width: 20px; height: 20px; transform: rotate(45deg); justify-self: center; }
    .shape.data { border-radius: 50% / 18%; }
    .shape.note { border-style: dashed; }
    .legend span { font-size: .77rem; color: #334155; }
    @media (max-width: 1000px) {
      main { grid-template-columns: 1fr; height: auto; overflow: visible; }
      .viewer { height: 700px; min-height: 700px; border-bottom: 2px solid var(--line); }
      .rail-resizer { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>{{HEADER_TITLE}}</h1>
      <p>{{REVISION_LINE}}</p>
    </div>
    <span class="badge">{{BADGE}}</span>
  </header>
  <main>
    <article class="viewer">
      <div class="toolbar">
        <strong>Drag in any direction · mouse wheel zooms at the pointer</strong>
        <div class="controls">
          <button type="button" id="zoom-out" aria-label="Zoom out">−</button>
          <button type="button" id="fit">Fit</button>
          <button type="button" id="actual">100%</button>
          <button type="button" id="zoom-in" aria-label="Zoom in">＋</button>
        </div>
      </div>
      <div id="viewport">
        <div id="diagram" aria-label="{{DIAGRAM_ARIA}}"></div>
      </div>
    </article>
    <div
      id="rail-resizer"
      class="rail-resizer"
      role="separator"
      aria-label="Resize information panel"
      aria-orientation="vertical"
      aria-valuemin="280"
      aria-valuemax="760"
      aria-valuenow="410"
      tabindex="0"
      title="Drag to resize · double-click to reset"
    ></div>
    <aside>
{{RAIL_CONTENT}}
    </aside>
  </main>
  <script type="text/plain" id="diagram-source">
{{MERMAID_SOURCE}}</script>
  <script src="{{MERMAJS_PATH}}"></script>
  <script>
    const viewport = document.getElementById('viewport');
    const target = document.getElementById('diagram');
    const source = document.getElementById('diagram-source').textContent.trim();
    const layout = document.querySelector('main');
    const rail = document.querySelector('aside');
    const railResizer = document.getElementById('rail-resizer');
    const railWidthKey = '{{STORAGE_KEY}}';
    let naturalWidth = 1800;
    let scale = 1;
    let drag = null;
    let railDrag = null;

    function railBounds() {
      return { min: 280, max: Math.min(760, Math.floor(window.innerWidth * 0.58)) };
    }

    function setRailWidth(width, persist) {
      const bounds = railBounds();
      const next = Math.round(Math.max(bounds.min, Math.min(bounds.max, width)));
      layout.style.setProperty('--rail-width', next + 'px');
      railResizer.setAttribute('aria-valuemax', String(bounds.max));
      railResizer.setAttribute('aria-valuenow', String(next));
      if (persist) {
        try { localStorage.setItem(railWidthKey, String(next)); } catch (_) { /* local file storage unavailable */ }
      }
    }

    let savedRailWidth = NaN;
    try { savedRailWidth = Number(localStorage.getItem(railWidthKey)); } catch (_) { /* use default */ }
    if (Number.isFinite(savedRailWidth) && savedRailWidth > 0) setRailWidth(savedRailWidth, false);

    function paintScale() {
      const svg = target.querySelector('svg');
      if (!svg) return;
      svg.style.width = Math.round(naturalWidth * scale) + 'px';
      document.getElementById('actual').textContent = Math.round(scale * 100) + '%';
    }

    function setScale(nextScale, clientX, clientY) {
      const svg = target.querySelector('svg');
      if (!svg) return;
      const viewportBox = viewport.getBoundingClientRect();
      const localX = clientX === undefined ? viewport.clientWidth / 2 : clientX - viewportBox.left;
      const localY = clientY === undefined ? viewport.clientHeight / 2 : clientY - viewportBox.top;
      const oldWidth = svg.getBoundingClientRect().width;
      const oldHeight = svg.getBoundingClientRect().height;
      const focusX = viewport.scrollLeft + localX;
      const focusY = viewport.scrollTop + localY;
      const ratioX = oldWidth > 0 ? focusX / oldWidth : 0;
      const ratioY = oldHeight > 0 ? focusY / oldHeight : 0;

      scale = Math.max(0.2, Math.min(2.5, nextScale));
      paintScale();

      const newWidth = svg.getBoundingClientRect().width;
      const newHeight = svg.getBoundingClientRect().height;
      viewport.scrollLeft = Math.max(0, ratioX * newWidth - localX);
      viewport.scrollTop = Math.max(0, ratioY * newHeight - localY);
    }

    function fitDiagram() {
      const usable = Math.max(600, viewport.clientWidth - 64);
      scale = Math.min(1, usable / naturalWidth);
      paintScale();
      viewport.scrollTo({ top: 0, left: 0 });
    }

    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'strict',
      theme: 'base',
      suppressErrorRendering: true,
      themeVariables: {
        background: 'transparent',
        primaryColor: '#ffffff',
        primaryBorderColor: '#111827',
        primaryTextColor: '#111827',
        lineColor: '#334155',
        clusterBkg: 'transparent',
        clusterBorder: '#111827'
      }
    });

    mermaid.render('{{RENDER_ID}}', source).then(function(result) {
      target.innerHTML = result.svg;
      const svg = target.querySelector('svg');
      const box = svg.viewBox && svg.viewBox.baseVal;
      naturalWidth = box && box.width ? Math.max(1600, box.width) : 1900;
      svg.removeAttribute('width');
      svg.removeAttribute('height');
      svg.style.background = 'transparent';
      scale = Math.min(1, (viewport.clientWidth - 64) / naturalWidth);
      paintScale();
      if (result.bindFunctions) result.bindFunctions(target);
    }).catch(function(error) {
      target.className = 'error';
      target.textContent = 'Diagram rendering failed: ' + String(error);
    });

    document.getElementById('zoom-in').addEventListener('click', function() { setScale(scale + 0.1); });
    document.getElementById('zoom-out').addEventListener('click', function() { setScale(scale - 0.1); });
    document.getElementById('fit').addEventListener('click', fitDiagram);
    document.getElementById('actual').addEventListener('click', function() { setScale(1); });

    viewport.addEventListener('pointerdown', function(event) {
      if (event.button !== 0) return;
      drag = {
        pointerId: event.pointerId,
        x: event.clientX,
        y: event.clientY,
        left: viewport.scrollLeft,
        top: viewport.scrollTop
      };
      viewport.setPointerCapture(event.pointerId);
      viewport.classList.add('dragging');
      event.preventDefault();
    });

    viewport.addEventListener('pointermove', function(event) {
      if (!drag || drag.pointerId !== event.pointerId) return;
      viewport.scrollLeft = drag.left - (event.clientX - drag.x);
      viewport.scrollTop = drag.top - (event.clientY - drag.y);
    });

    function stopDragging(event) {
      if (!drag || drag.pointerId !== event.pointerId) return;
      drag = null;
      viewport.classList.remove('dragging');
      if (viewport.hasPointerCapture(event.pointerId)) viewport.releasePointerCapture(event.pointerId);
    }

    viewport.addEventListener('pointerup', stopDragging);
    viewport.addEventListener('pointercancel', stopDragging);
    viewport.addEventListener('wheel', function(event) {
      event.preventDefault();
      const factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
      setScale(scale * factor, event.clientX, event.clientY);
    }, { passive: false });

    railResizer.addEventListener('pointerdown', function(event) {
      if (event.button !== 0) return;
      railDrag = { pointerId: event.pointerId, x: event.clientX, width: rail.getBoundingClientRect().width };
      railResizer.setPointerCapture(event.pointerId);
      railResizer.classList.add('dragging');
      document.body.classList.add('resizing-rail');
      event.preventDefault();
    });

    railResizer.addEventListener('pointermove', function(event) {
      if (!railDrag || railDrag.pointerId !== event.pointerId) return;
      setRailWidth(railDrag.width + railDrag.x - event.clientX, false);
    });

    function stopRailResize(event) {
      if (!railDrag || railDrag.pointerId !== event.pointerId) return;
      railDrag = null;
      railResizer.classList.remove('dragging');
      document.body.classList.remove('resizing-rail');
      setRailWidth(rail.getBoundingClientRect().width, true);
      if (railResizer.hasPointerCapture(event.pointerId)) railResizer.releasePointerCapture(event.pointerId);
    }

    railResizer.addEventListener('pointerup', stopRailResize);
    railResizer.addEventListener('pointercancel', stopRailResize);
    railResizer.addEventListener('dblclick', function() { setRailWidth(410, true); });
    railResizer.addEventListener('keydown', function(event) {
      const step = event.shiftKey ? 48 : 16;
      const current = rail.getBoundingClientRect().width;
      if (event.key === 'ArrowLeft') setRailWidth(current + step, true);
      else if (event.key === 'ArrowRight') setRailWidth(current - step, true);
      else if (event.key === 'Home') setRailWidth(railBounds().min, true);
      else if (event.key === 'End') setRailWidth(railBounds().max, true);
      else return;
      event.preventDefault();
    });
    window.addEventListener('resize', function() { setRailWidth(rail.getBoundingClientRect().width, false); });
  </script>
</body>
</html>
