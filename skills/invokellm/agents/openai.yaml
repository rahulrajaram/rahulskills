interface:
  display_name: "Invoke LLM"
  short_description: "Invoke one or more AI CLIs via gptengage; default to gemini, claude, and codex."
  default_prompt: "Run /invokellm via ~/.local/bin/gptengage invoke. Pass --timeout 600 to gptengage itself, not just an outer shell timeout. If no CLI is specified, consult gemini, claude, and codex with the same prompt."
