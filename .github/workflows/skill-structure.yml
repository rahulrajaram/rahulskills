name: Skill structure

on:
  pull_request:
  push:
    branches: [master]

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble and install skills
        run: ./stitch-skills.sh install

      - name: Run Codex skill structure test
        run: ./tests/test_codex_skill_structure.sh

      - name: Run Claude skill structure test
        run: ./tests/test_claude_skill_structure.sh

      - name: Run skill frontmatter test
        run: ./tests/test_skill_frontmatter.sh

      - name: Run overlay structure test
        run: ./tests/test_overlay_structure.sh

      - name: Run stitch assembly test
        run: ./tests/test_stitch_assembly.sh

      - name: Run Python tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
